name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install fyne CLI
        if: runner.os != 'macOS'
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Test
        run: go test ./...

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: fyne package -os linux --release -name qGif -icon icon.png -app-id io.github.mamorett.qgif

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: fyne package -os windows --release -name qGif -icon icon.png -app-id io.github.mamorett.qgif

      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          chmod +x bundle_macos.sh
          ./bundle_macos.sh
          cd build && zip -r -y ../qGif-macos.zip qGif.app && cd ..

      - name: Upload artifact (linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: qgif-linux
          path: qGif.tar.xz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qgif-windows
          path: qGif.exe.zip

      - name: Upload artifact (macos)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: qgif-macos
          path: qGif-macos.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
